name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint web
        run: bun run lint:web

      - name: Build web
        env:
          VITE_API_BASE_URL: https://anifusion-api-976317870900.asia-northeast1.run.app
        run: bun run build:web

      - name: Test web
        run: bun run test:web

      - name: Install Playwright browsers
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Test web E2E
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
        run: |
          bun run dev -- --host 127.0.0.1 --port 3000 > /tmp/anifusion-vite.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent --max-time 1 http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --max-time 2 http://127.0.0.1:3000/ > /dev/null
          bun run test:e2e

  api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Test API
        working-directory: apps/api
        run: go test ./...
