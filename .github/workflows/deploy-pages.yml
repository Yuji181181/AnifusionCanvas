name: Deploy Web to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web
        env:
          VITE_API_BASE_URL: https://anifusion-api-976317870900.asia-northeast1.run.app
        run: bun run build:web

      - name: Deploy to Cloudflare Pages
        run: bunx wrangler pages deploy apps/web/dist --project-name anifusion-canvas --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: fcd71b61f590ce4fc12a03c221e027cd
