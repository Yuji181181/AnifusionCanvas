name: Deploy API to Cloud Run

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: anifusioncanvas
      GCP_REGION: asia-northeast1
      GCP_ARTIFACT_REPOSITORY: anifusion
      GCP_SERVICE_NAME: anifusion-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker $GCP_REGION-docker.pkg.dev --quiet

      - name: Write production env file
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET=${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL=${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_ENDPOINT_URL=${{ secrets.R2_ENDPOINT_URL }}
          R2_REGION=auto
          REPLICATE_API_TOKEN=${{ secrets.REPLICATE_API_TOKEN }}
          APP_ENV=production
          API_PORT=8080
          FRONTEND_ORIGIN=https://anifusion-canvas.pages.dev
          VITE_API_BASE_URL=https://anifusion-api-976317870900.asia-northeast1.run.app
          EOF

      - name: Deploy
        run: bash infra/cloud-run/deploy.sh
