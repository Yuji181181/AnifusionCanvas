name: Deploy API to Cloud Run via Secret Manager

on:
  workflow_dispatch:
    inputs:
      replicate_mode:
        description: "Replicate inference mode: demo or replicate"
        required: true
        default: "demo"
        type: choice
        options:
          - demo
          - replicate
      tooncrafter_version:
        description: "Replicate ToonCrafter version ID or owner/name[:version]"
        required: false
        default: ""
      sdxl_inpainting_version:
        description: "Replicate SDXL Inpainting version ID or owner/name[:version]"
        required: false
        default: ""
      r2_public_base_url:
        description: "Public R2 base URL required for replicate mode"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: anifusioncanvas
      GCP_REGION: asia-northeast1
      GCP_ARTIFACT_REPOSITORY: anifusion
      GCP_SERVICE_NAME: anifusion-api
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      REPLICATE_MODE: ${{ inputs.replicate_mode }}
      REPLICATE_TOONCRAFTER_VERSION: ${{ inputs.tooncrafter_version }}
      REPLICATE_SDXL_INPAINTING_VERSION: ${{ inputs.sdxl_inpainting_version }}
      R2_PUBLIC_BASE_URL: ${{ inputs.r2_public_base_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker $GCP_REGION-docker.pkg.dev --quiet

      - name: Deploy with Secret Manager
        run: bash infra/cloud-run/deploy-secret-manager.sh
