name: Deploy API to Cloud Run via Secret Manager

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: anifusioncanvas
      GCP_REGION: asia-northeast1
      GCP_ARTIFACT_REPOSITORY: anifusion
      GCP_SERVICE_NAME: anifusion-api
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker $GCP_REGION-docker.pkg.dev --quiet

      - name: Deploy with Secret Manager
        run: bash infra/cloud-run/deploy-secret-manager.sh
