services:
  api:
    build:
      context: ./apps/api
    env_file:
      - ./.env
    environment:
      API_PORT: 8080
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"

  web:
    image: oven/bun:1.3.12
    working_dir: /app/apps/web
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    env_file:
      - ./.env
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    depends_on:
      - api
